<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Đăng nhập | KhanhTech</title>

    <meta
        name="description"
        content="Đăng nhập KhanhTech Account"
    >

    <!-- CSS ROOT -->
    <link rel="stylesheet" href="../style.css">

    <!-- ACCOUNT CSS -->
    <link rel="stylesheet" href="account.css">

    <style>

        /* =====================================
           LOGIN PAGE
        ===================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
        }


        .login-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 110px 20px 60px;
        }


        .login-container {
            width: 100%;
            max-width: 430px;
        }


        /* =====================================
           HEADER
        ===================================== */

        .login-header {
            text-align: center;

            margin-bottom: 28px;
        }


        .login-logo {
            width: 68px;
            height: 68px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background:
                var(--gradient,
                linear-gradient(
                    135deg,
                    #6d5dfc,
                    #8f7cff
                ));

            color: white;

            font-size: 27px;
            font-weight: 900;

            box-shadow:
                0 18px 45px
                rgba(109, 93, 252, .28);
        }


        .login-header h1 {
            margin: 0 0 9px;

            color: var(--text);

            font-size: 34px;

            font-weight: 850;

            letter-spacing: -1.5px;
        }


        .login-header p {
            margin: 0;

            color: var(--text-secondary);

            font-size: 14px;
        }


        /* =====================================
           CARD
        ===================================== */

        .login-card {
            width: 100%;

            padding: 30px;

            border: 1px solid var(--border);

            border-radius: 24px;

            background: var(--surface);

            box-shadow:
                0 25px 80px
                rgba(0, 0, 0, .12);
        }


        /* =====================================
           MESSAGE
        ===================================== */

        .login-message {
            display: none;

            margin-bottom: 18px;

            padding: 13px 14px;

            border-radius: 12px;

            background:
                rgba(109, 93, 252, .10);

            border:
                1px solid
                rgba(109, 93, 252, .20);

            color: var(--text);

            font-size: 13px;

            line-height: 1.5;
        }


        /* =====================================
           FORM
        ===================================== */

        .form-group {
            margin-bottom: 19px;
        }


        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: var(--text);

            font-size: 13px;

            font-weight: 750;
        }


        .form-input {
            width: 100%;

            height: 52px;

            padding: 0 15px;

            border:
                1px solid
                var(--border);

            border-radius: 12px;

            outline: none;

            background:
                var(--bg-secondary,
                rgba(128,128,128,.06));

            color: var(--text);

            font-family: inherit;

            font-size: 14px;

            transition: .2s ease;
        }


        .form-input::placeholder {
            color: var(--text-muted);
        }


        .form-input:focus {
            border-color:
                var(--accent,
                #6d5dfc);

            box-shadow:
                0 0 0 4px
                rgba(109, 93, 252, .10);
        }


        /* =====================================
           PASSWORD
        ===================================== */

        .input-wrapper {
            position: relative;
        }


        .password-input {
            padding-right: 55px;
        }


        .password-toggle {
            position: absolute;

            top: 50%;
            right: 7px;

            transform:
                translateY(-50%);

            width: 40px;
            height: 40px;

            border: 0;

            border-radius: 10px;

            background: transparent;

            color: var(--text-muted);

            cursor: pointer;

            font-size: 16px;
        }


        .password-toggle:hover {
            background:
                var(--bg-secondary);

            color: var(--text);
        }


        /* =====================================
           OPTIONS
        ===================================== */

        .form-options {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin:
                3px 0 22px;

            font-size: 12px;
        }


        .remember {
            display: flex;

            align-items: center;

            gap: 7px;

            color: var(--text-secondary);

            cursor: pointer;
        }


        .remember input {
            accent-color:
                var(--accent,
                #6d5dfc);
        }


        .forgot {
            color:
                var(--accent,
                #6d5dfc);

            text-decoration: none;
        }


        .forgot:hover {
            text-decoration: underline;
        }


        /* =====================================
           BUTTON
        ===================================== */

        .login-button {
            width: 100%;

            height: 52px;

            border: none;

            border-radius: 12px;

            background:
                var(--gradient,
                linear-gradient(
                    135deg,
                    #6d5dfc,
                    #8f7cff
                ));

            color: white;

            font-family: inherit;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            transition: .2s ease;
        }


        .login-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 35px
                rgba(109, 93, 252, .25);
        }


        .login-button:active {
            transform: translateY(0);
        }


        .login-button:disabled {
            opacity: .65;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }


        /* =====================================
           DIVIDER
        ===================================== */

        .divider {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 25px 0;

            color: var(--text-muted);

            font-size: 10px;

            font-weight: 750;

            letter-spacing: .5px;
        }


        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background:
                var(--border);
        }


        /* =====================================
           REGISTER
        ===================================== */

        .register-text {
            text-align: center;

            color: var(--text-secondary);

            font-size: 13px;
        }


        .register-text a {
            color:
                var(--accent,
                #6d5dfc);

            font-weight: 800;

            text-decoration: none;
        }


        .register-text a:hover {
            text-decoration: underline;
        }


        /* =====================================
           SECURITY
        ===================================== */

        .security-note {
            margin-top: 18px;

            text-align: center;

            color: var(--text-muted);

            font-size: 11px;

            line-height: 1.6;
        }


        /* =====================================
           NAV
        ===================================== */

        .simple-nav {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            z-index: 100;

            height: 70px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 25px;

            border-bottom:
                1px solid
                var(--border);

            background:
                var(--surface);

            backdrop-filter:
                blur(18px);
        }


        .simple-logo {
            color: var(--text);

            text-decoration: none;

            font-size: 17px;

            font-weight: 900;

            letter-spacing: -.5px;
        }


        .simple-links {
            display: flex;

            align-items: center;

            gap: 18px;
        }


        .simple-links a {
            color: var(--text-secondary);

            text-decoration: none;

            font-size: 13px;

            font-weight: 650;
        }


        .simple-links a:hover {
            color: var(--text);
        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 550px) {

            .login-page {
                padding:
                    100px 14px 45px;
            }


            .login-card {
                padding:
                    23px 19px;
            }


            .login-header h1 {
                font-size: 29px;
            }


            .simple-nav {
                padding:
                    0 16px;
            }


            .simple-links {
                gap: 11px;
            }


            .simple-links a {
                font-size: 11px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================
     NAVIGATION
===================================== -->

<header class="simple-nav">

    <a
        href="../index.html"
        class="simple-logo"
    >
        KHANHTECH
    </a>


    <nav class="simple-links">

        <a href="../index.html">
            Trang chủ
        </a>

        <a href="../khanhos.html">
            Khám phá
        </a>

        <a href="register.html">
            Đăng ký
        </a>

    </nav>

</header>



<!-- =====================================
     LOGIN
===================================== -->

<main class="login-page">

    <div class="login-container">


        <!-- HEADER -->

        <section class="login-header">

            <div class="login-logo">
                K
            </div>


            <h1>
                Chào mừng trở lại
            </h1>


            <p>
                Đăng nhập vào KhanhTech Account
            </p>

        </section>



        <!-- CARD -->

        <section class="login-card">


            <!-- MESSAGE -->

            <div
                id="loginMessage"
                class="login-message"
            ></div>



            <!-- FORM -->

            <form id="loginForm">


                <!-- GMAIL -->

                <div class="form-group">

                    <label for="email">
                        Gmail
                    </label>


                    <input
                        id="email"
                        name="email"
                        class="form-input"
                        type="email"
                        placeholder="example@gmail.com"
                        autocomplete="email"
                        maxlength="120"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Mật khẩu
                    </label>


                    <div class="input-wrapper">

                        <input
                            id="password"
                            name="password"
                            class="form-input password-input"
                            type="password"
                            placeholder="Nhập mật khẩu"
                            autocomplete="current-password"
                            minlength="8"
                            maxlength="128"
                            required
                        >


                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Hiện mật khẩu"
                        >
                            👁
                        </button>

                    </div>

                </div>



                <!-- OPTIONS -->

                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Ghi nhớ đăng nhập

                    </label>


                    <a
                        href="#"
                        id="forgotPassword"
                        class="forgot"
                    >
                        Quên mật khẩu?
                    </a>

                </div>



                <!-- LOGIN -->

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Đăng nhập
                </button>

            </form>



            <!-- DIVIDER -->

            <div class="divider">

                KHANHTECH ACCOUNT

            </div>



            <!-- REGISTER -->

            <div class="register-text">

                Chưa có tài khoản?

                <a href="register.html">
                    Tạo tài khoản
                </a>

            </div>

        </section>



        <!-- SECURITY -->

        <div class="security-note">

            🔒 Thông tin tài khoản được xử lý
            thông qua hệ thống KhanhTech Account.

        </div>

    </div>

</main>



<!-- =====================================
     JAVASCRIPT
===================================== -->

<script>

const form =
    document.getElementById(
        "loginForm"
    );


const email =
    document.getElementById(
        "email"
    );


const password =
    document.getElementById(
        "password"
    );


const button =
    document.getElementById(
        "loginButton"
    );


const message =
    document.getElementById(
        "loginMessage"
    );


const toggle =
    document.getElementById(
        "togglePassword"
    );


const forgot =
    document.getElementById(
        "forgotPassword"
    );



/* =====================================
   MESSAGE
===================================== */

function showMessage(text) {

    message.textContent =
        text;

    message.style.display =
        "block";

}



/* =====================================
   PASSWORD
===================================== */

toggle.addEventListener(
    "click",
    function () {

        if (
            password.type ===
            "password"
        ) {

            password.type =
                "text";

            toggle.textContent =
                "🙈";

        } else {

            password.type =
                "password";

            toggle.textContent =
                "👁";

        }

    }
);



/* =====================================
   LOGIN
===================================== */

form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const emailValue =
            email.value
                .trim()
                .toLowerCase();


        const passwordValue =
            password.value;


        message.style.display =
            "none";


        /* CHECK EMAIL */

        if (
            !emailValue.endsWith(
                "@gmail.com"
            )
        ) {

            showMessage(
                "Vui lòng nhập địa chỉ Gmail hợp lệ."
            );

            return;

        }


        /* CHECK PASSWORD */

        if (
            passwordValue.length < 8
        ) {

            showMessage(
                "Mật khẩu phải có ít nhất 8 ký tự."
            );

            return;

        }


        /*
         * =================================
         * BACKEND
         * =================================
         *
         * Sau này kết nối API tại đây.
         *
         * Ví dụ:
         *
         * const response = await fetch(
         *     "https://api.khanhtech.vn/auth/login",
         *     {
         *         method: "POST",
         *
         *         headers: {
         *             "Content-Type":
         *                 "application/json"
         *         },
         *
         *         body: JSON.stringify({
         *             email: emailValue,
         *             password: passwordValue
         *         })
         *     }
         * );
         *
         * const data =
         *     await response.json();
         *
         * Nếu backend trả về:
         *
         * {
         *     "success": true
         * }
         *
         * thì chuyển sang:
         *
         * window.location.href =
         *     "verify.html";
         */


        button.disabled =
            true;

        button.textContent =
            "Đang kiểm tra...";


        /*
         * DEMO FRONTEND
         */

        setTimeout(
            function () {

                button.disabled =
                    false;

                button.textContent =
                    "Đăng nhập";


                showMessage(
                    "Giao diện đăng nhập đang hoạt động. Backend xác thực sẽ được kết nối sau."
                );

            },
            800
        );

    }
);



/* =====================================
   FORGOT PASSWORD
===================================== */

forgot.addEventListener(
    "click",
    function (event) {

        event.preventDefault();


        showMessage(
            "Tính năng khôi phục tài khoản sẽ được bổ sung."
        );

    }
);

</script>


</body>
</html>
