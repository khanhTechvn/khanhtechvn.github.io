<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tạo tài khoản | KhanhTech</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="account.css">
</head>

<body>

    <header class="navbar">

        <div class="nav-container">

            <a href="../index.html" class="logo">
                KHANHTECH
            </a>

            <div class="nav-actions">

                <a
                    href="login.html"
                    class="btn btn-secondary"
                >
                    Đăng nhập
                </a>

            </div>

        </div>

    </header>


    <main class="account-page">

        <section class="account-card register-card">

            <div class="account-logo">
                K
            </div>

            <h1>
                Tạo tài khoản
            </h1>

            <p class="account-subtitle">
                Tạo KhanhTech Account miễn phí
            </p>


            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Tên hiển thị
                    </label>

                    <input
                        id="name"
                        type="text"
                        placeholder="Tên của bạn"
                        required
                        minlength="2"
                        maxlength="50"
                        autocomplete="name"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="you@example.com"
                        required
                        autocomplete="email"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Mật khẩu
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="Ít nhất 8 ký tự"
                        required
                        minlength="8"
                        autocomplete="new-password"
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Nhập lại mật khẩu
                    </label>

                    <input
                        id="confirmPassword"
                        type="password"
                        placeholder="Nhập lại mật khẩu"
                        required
                        minlength="8"
                        autocomplete="new-password"
                    >

                </div>


                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        Tôi đồng ý với
                        <a href="#">
                            Điều khoản sử dụng
                        </a>
                        và
                        <a href="#">
                            Chính sách bảo mật
                        </a>.
                    </span>

                </label>


                <button
                    type="submit"
                    class="account-submit"
                >
                    Tạo tài khoản
                </button>

            </form>


            <div
                id="registerMessage"
                class="account-message"
            ></div>


            <div class="account-register">

                Đã có tài khoản?

                <a href="login.html">
                    Đăng nhập
                </a>

            </div>

        </section>

    </main>


    <script src="../script.js"></script>
    <script src="account.js"></script>

</body>
</html>
