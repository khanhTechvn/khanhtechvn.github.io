<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký | KhanhTech</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        .register-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 60px;
        }

        .register-box {
            width: 100%;
            max-width: 450px;
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background: var(--gradient);
            color: white;

            font-size: 22px;
            font-weight: 900;
        }

        .register-header h1 {
            margin-bottom: 10px;
            font-size: 34px;
        }

        .register-header p {
            color: var(--text-secondary);
        }

        .register-card {
            padding: 32px;

            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;

            box-shadow:
                0 25px 80px rgba(0,0,0,.12);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;

            font-size: 13px;
            font-weight: 700;
        }

        .form-input {
            width: 100%;
            height: 50px;

            padding: 0 15px;

            border:
                1px solid
                var(--border);

            border-radius: 12px;

            outline: none;

            background:
                var(--bg-secondary);

            color:
                var(--text);

            font-size: 14px;
        }

        .form-input:focus {
            border-color:
                var(--accent);

            box-shadow:
                0 0 0 4px
                rgba(109,93,252,.1);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 55px;
        }

        .show-password {
            position: absolute;
            right: 10px;
            top: 50%;

            transform:
                translateY(-50%);

            border: none;
            background: transparent;

            cursor: pointer;
        }

        .password-strength {
            margin-top: 8px;

            height: 4px;

            border-radius: 10px;

            background:
                var(--border);

            overflow: hidden;
        }

        .password-strength div {
            height: 100%;
            width: 0;

            transition: .25s;
        }

        .terms {
            display: flex;
            gap: 8px;

            margin: 20px 0;

            color:
                var(--text-secondary);

            font-size: 12px;
            line-height: 1.5;
        }

        .terms input {
            margin-top: 3px;
            accent-color: var(--accent);
        }

        .terms a {
            color: var(--accent);
        }

        .register-button {
            width: 100%;
            height: 50px;

            border: none;
            border-radius: 12px;

            background:
                var(--gradient);

            color: white;

            font-weight: 800;

            cursor: pointer;

            transition: .2s;
        }

        .register-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 30px
                rgba(109,93,252,.25);
        }

        .message {
            display: none;

            margin-bottom: 18px;
            padding: 12px;

            border-radius: 10px;

            background:
                rgba(109,93,252,.1);

            font-size: 13px;
        }

        .login-link {
            text-align: center;

            margin-top: 22px;

            font-size: 13px;

            color:
                var(--text-secondary);
        }

        .login-link a {
            color: var(--accent);
            font-weight: 700;
        }

        @media(max-width:500px) {
            .register-card {
                padding: 24px 20px;
            }
        }
    </style>
</head>

<body>

<header class="navbar">

    <div class="nav-container">

        <a
            href="../index.html"
            class="logo"
        >
            KHANHTECH
        </a>

        <nav class="nav-menu">

            <a href="../index.html">
                Trang chủ
            </a>

            <a href="../khanhos.html">
                Khám phá
            </a>

        </nav>

        <div class="nav-actions">

            <a
                href="login.html"
                class="btn btn-secondary"
            >
                Đăng nhập
            </a>

        </div>

    </div>

</header>


<main class="register-page">

    <div class="register-box">

        <div class="register-header">

            <div class="register-logo">
                K
            </div>

            <h1>
                Tạo tài khoản
            </h1>

            <p>
                Tham gia hệ sinh thái KhanhTech
            </p>

        </div>


        <div class="register-card">

            <div
                id="message"
                class="message"
            ></div>


            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Tên hiển thị
                    </label>

                    <input
                        id="name"
                        class="form-input"
                        type="text"
                        placeholder="Khanh"
                        maxlength="40"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Gmail
                    </label>

                    <input
                        id="email"
                        class="form-input"
                        type="email"
                        placeholder="example@gmail.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Mật khẩu
                    </label>

                    <div class="password-wrapper">

                        <input
                            id="password"
                            class="form-input"
                            type="password"
                            placeholder="Tạo mật khẩu"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                        >
                            👁
                        </button>

                    </div>

                    <div class="password-strength">
                        <div id="strengthBar"></div>
                    </div>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Xác nhận mật khẩu
                    </label>

                    <input
                        id="confirmPassword"
                        class="form-input"
                        type="password"
                        placeholder="Nhập lại mật khẩu"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>


                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        Tôi đồng ý với
                        <a href="#">
                            Điều khoản sử dụng
                        </a>
                        và
                        <a href="#">
                            Chính sách bảo mật
                        </a>
                        của KhanhTech.
                    </span>

                </label>


                <button
                    type="submit"
                    class="register-button"
                >
                    Tạo tài khoản
                </button>

            </form>


            <div class="login-link">

                Đã có tài khoản?

                <a href="login.html">
                    Đăng nhập
                </a>

            </div>

        </div>

    </div>

</main>


<script>

const form =
    document.getElementById("registerForm");

const message =
    document.getElementById("message");

const password =
    document.getElementById("password");

const confirmPassword =
    document.getElementById("confirmPassword");

const strengthBar =
    document.getElementById("strengthBar");

const showPassword =
    document.getElementById("showPassword");


/* HIỆN MẬT KHẨU */

showPassword.addEventListener(
    "click",
    () => {

        const visible =
            password.type === "text";

        password.type =
            visible ? "password" : "text";

        confirmPassword.type =
            visible ? "password" : "text";

        showPassword.textContent =
            visible ? "👁" : "🙈";

    }
);


/* ĐÁNH GIÁ MẬT KHẨU */

password.addEventListener(
    "input",
    () => {

        const value =
            password.value;

        let score = 0;

        if (value.length >= 8)
            score++;

        if (/[A-Z]/.test(value))
            score++;

        if (/[0-9]/.test(value))
            score++;

        if (/[^A-Za-z0-9]/.test(value))
            score++;


        const widths =
            ["0%", "25%", "50%", "75%", "100%"];

        strengthBar.style.width =
            widths[score];

    }
);


/* ĐĂNG KÝ */

form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        const name =
            document.getElementById("name")
                .value.trim();

        const email =
            document.getElementById("email")
                .value.trim();

        const passwordValue =
            password.value;

        const confirmValue =
            confirmPassword.value;


        if (
            !email.toLowerCase()
                .endsWith("@gmail.com")
        ) {

            message.style.display =
                "block";

            message.textContent =
                "Vui lòng sử dụng địa chỉ Gmail.";

            return;
        }


        if (
            passwordValue !==
            confirmValue
        ) {

            message.style.display =
                "block";

            message.textContent =
                "Hai mật khẩu không giống nhau.";

            return;
        }


        if (
            passwordValue.length < 8
        ) {

            message.style.display =
                "block";

            message.textContent =
                "Mật khẩu phải có ít nhất 8 ký tự.";

            return;
        }


        /*
         * CHƯA CÓ BACKEND
         *
         * Sau này thay đoạn này bằng:
         *
         * fetch("https://api.khanhtechvn.github.io/auth/register", {
         *     method: "POST",
         *     headers: {
         *         "Content-Type": "application/json"
         *     },
         *     body: JSON.stringify({
         *         name,
         *         email,
         *         password: passwordValue
         *     })
         * })
         */

        message.style.display =
            "block";

        message.textContent =
            "Thông tin hợp lệ. Bước tiếp theo sẽ gửi mã OTP 6 số tới Gmail của bạn.";

    }
);

</script>

</body>
</html>
