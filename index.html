    <script>

        const API_URL =
            "https://khanhtech-backend.vercel.app";


        async function checkBackend() {

            const navStatus =
                document.getElementById("navStatus");

            const apiStatus =
                document.getElementById("apiStatus");


            try {

                const response =
                    await fetch(
                        API_URL + "/api/health"
                    );


                const data =
                    await response.json();


                if (
                    response.ok &&
                    data.online === true &&
                    data.database === "connected"
                ) {

                    navStatus.textContent =
                        "Online";


                    apiStatus.textContent =
                        JSON.stringify(
                            data,
                            null,
                            2
                        );

                } else {

                    navStatus.textContent =
                        "Database Error";


                    apiStatus.textContent =
                        JSON.stringify(
                            data,
                            null,
                            2
                        );

                }


            } catch (error) {

                navStatus.textContent =
                    "Offline";


                apiStatus.textContent =
                    JSON.stringify(
                        {
                            online: false,
                            error: error.message
                        },
                        null,
                        2
                    );

            }

        }


        checkBackend();


        setInterval(
            checkBackend,
            30000
        );

    </script>
